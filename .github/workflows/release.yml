name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # รันชุดทดสอบทั้งหมดแบบ headless (Edge มากับ runner อยู่แล้ว) — fail = ไม่ปล่อย Release
      - name: Run test harness
        run: npm test

      # กันลืม bump version: tag v* ต้องตรงกับ version ใน package.json เสมอ
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG ไม่ตรงกับ version ใน package.json ($PKG) — แก้ version ให้ตรงก่อน"
            exit 1
          fi

      # รอบปกติ (push บน main): แค่ build ยืนยันว่าโค้ดสมบูรณ์ — badge สถานะ build ชี้มาที่นี่
      - name: Build (CI check)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run dist

      # รอบปล่อยเวอร์ชัน (push tag v*): build แล้วอัปโหลดตัวติดตั้ง + latest.yml + blockmap ขึ้น GitHub Release อัตโนมัติ
      - name: Build & Publish Release
        if: "startsWith(github.ref, 'refs/tags/v')"
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
